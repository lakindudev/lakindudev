name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # You must add a Personal Access Token as a repository secret named STREAK_STATS_TOKEN
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          options: user=${{ github.repository_owner }}&theme=tokyonight
          path: streak-stats.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push
